<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Indicador Quant</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        
        
       <!-- Cole este bloco em uma div vazia no seu index.html para testar se a rede libera -->
        <div class="tradingview-widget-container" style="height:400px; width:100%;">
          <div id="tradingview_cmin3" style="height:calc(100% - 32px); width:100%;"></div>
          <script type="text/javascript" src="https://tradingview.com"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "id": "tradingview_cmin3",
            "width": "100%",
            "height": "100%",
            "symbol": "BMFBOVESPA:CMIN3",
            "interval": "D",
            "timezone": "America/Sao_Paulo",
            "theme": "dark",
            "style": "1",
            "locale": "br",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_cmin3"
          });
          </script>
        </div>

        
        
        <!-- CABEÇALHO DO APP -->
        <header class="text-center py-4 border-b border-gray-800">
            <h1 class="text-2xl font-bold text-emerald-400">📊 Scanner de Reversão</h1>
            <p class="text-sm text-gray-400 mt-1">Monitorando 50 ações em tempo real</p>
        </header>

        <!-- CARD PRINCIPAL: RESULTADO ATUAL (OTIMIZADO PARA MOBILE) -->
        <div class="bg-gray-850 bg-opacity-50 border border-gray-800 rounded-2xl p-6 text-center shadow-xl backdrop-blur-sm">
            <p class="text-gray-400 text-sm uppercase tracking-wider font-semibold">Previsão Estatística</p>
            <p class="text-xs text-gray-500 mt-0.5">Sinais detectados no fechamento</p>
            
            <!-- Rótulo Principal -->
            <div class="text-white font-extrabold mt-4 text-base">
                Resultado atual:
            </div>
            
            <!-- Números grandes centralizados e isolados abaixo (ID para o JS injetar) -->
            <div id="resultado-atual" class="text-5xl font-extrabold text-emerald-400 tracking-tight mt-1">
                0-0-0
            </div>
        </div>


        <!-- BOTÃO DE ATUALIZAÇÃO MANUAL -->
        <div class="px-1">
            <button id="btn-atualizar" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-gray-900 font-bold py-4 px-6 rounded-2xl shadow-lg transform active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-emerald-400">
                <!-- Ícone de recarregar (SVG) -->
                <svg class="w-5 h-5 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"></path>
                </svg>
                <span>Atualizar Dados da Bolsa</span>
            </button>
        </div>


        <!-- LISTA DE RESULTADOS ANTERIORES -->
        <div class="space-y-3">
            <h2 class="text-lg font-semibold text-gray-300 px-1">Histórico de Sinais</h2>
            
            <div id="lista-historico" class="space-y-2">
                <!-- Os itens abaixo servem como exemplo visual e serão gerados dinamicamente pelo JavaScript depois -->
                
                <!-- Exemplo 1: Martelo (Subiu - Fundo Verde) -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">12</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>/</span> Bolsa Subiu
                    </div>
                </div>

                <!-- Exemplo 2: Engolfo de Alta (V desceu e subiu - Fundo Verde) -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">08</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>V</span> Reversão de Fundo
                    </div>
                </div>

                <!-- Exemplo 3: Reversão de Baixa / Alerta Falso (^ subiu e desceu - Fundo Vermelho) -->
                <div class="flex items-center justify-between bg-rose-950 bg-opacity-40 border border-rose-900 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-rose-400 font-bold">03</span></span>
                    <div class="flex items-center gap-2 bg-rose-500 text-rose-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>^</span> Bolsa Recuou
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
