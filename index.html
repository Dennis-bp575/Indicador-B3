<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicador B3</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
     <!-- <script src="https://jsdelivr.net"></script> -->

        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletor de Estratégia</title>
    <style>
        /* Container principal com o fundo escuro do exemplo */
        .container-estrategia {
            background-color: #171e2b;
            padding: 20px;
            border-radius: 8px;
            font-family: sans-serif;
            color: #94a3b8;
        }

        .titulo-seletor {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Grupo de botões lado a lado */
        .grupo-opcoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Esconde o rádio button nativo (aquela bolinha feia) */
        .opcao-item input[type="radio"] {
            display: none;
        }

        /* Estilização padrão do botão desmarcado (Baixa/Neutro) */
        .opcao-item .botao-customizado {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* Efeito de hover (passar o mouse) */
        .opcao-item .botao-customizado:hover {
            background-color: #334155;
            color: #f1f5f9;
        }

        /* Estilização quando o botão estiver SELECIONADO */
        .opcao-item input[type="radio"]:checked + .botao-customizado {
            background-color: #064e3b; /* Fundo verde escuro */
            border-color: #10b981;     /* Borda verde brilhante */
            color: #34d399;            /* Texto verde claro */
        }

        /* Pequena seta indicativa opcional após o texto */
        .botao-customizado::after {
            content: " ▾";
            margin-left: 8px;
            font-size: 10px;
            opacity: 0.7;
        }
        
        /* Muda a seta quando selecionado */
        .opcao-item input[type="radio"]:checked + .botao-customizado::after {
            content: " ▲";
            opacity: 1;
        }
    </style>
    
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto space-y-6">
        <!-- CARD PRINCIPAL: SELETOR DE ESTRATÉGIA E SINAL -->
        <div class="bg-gray-850 bg-opacity-50 border border-gray-800 rounded-2xl p-4 text-center shadow-xl backdrop-blur-sm">
            
            <div class="container-estrategia">
                <div class="titulo-seletor">Selecione Estratégia:</div>
                
                <div class="grupo-opcoes" id="seletorEstrategia">
                    <!-- Opção Varejo -->
                    <label class="opcao-item">
                        <input type="radio" name="estrategia" value="app_Varejo.js">
                        <span class="botao-customizado">Varejo / Mobilidade</span>
                    </label>
                    
                    <!-- Opção Petróleo-Energia -->
                    <label class="opcao-item">
                        <input type="radio" name="estrategia" value="app_Petroleo_Energia.js">
                        <span class="botao-customizado">Petróleo / Energia</span>
                    </label>
                    
                    <!-- Opção Teste (Ativos) -->
                    <label class="opcao-item">
                        <input type="radio" name="estrategia" value="app_teste.js">
                        <span class="botao-customizado">Ativos</span>
                    </label>
                </div>
            </div>
            
            <!-- NOVAS ABAS DE ATIVOS (Fica oculto por padrão e aparece imediatamente abaixo dos botões se "Ativos" for clicado) -->
            <div id="container-abas-ativos" class="hidden mt-4 pt-4 border-t border-gray-800">
                <div class="flex justify-center gap-2 bg-gray-900/60 p-1.5 rounded-xl border border-gray-800">
                    <button class="aba-ativo flex-1 py-2 px-3 rounded-lg text-sm font-semibold transition-all duration-200 bg-emerald-500 text-emerald-950 shadow-md" data-ativo="CSAN3">
                        CSAN3
                    </button>
                    <button class="aba-ativo flex-1 py-2 px-3 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-400 hover:text-gray-200 hover:bg-gray-800/50" data-ativo="CEAB3">
                        CEAB3
                    </button>
                    <button class="aba-ativo flex-1 py-2 px-3 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-400 hover:text-gray-200 hover:bg-gray-800/50" data-ativo="VAMO3">
                        VAMO3
                    </button>
                </div>
            </div>
            
            <!-- Bloco de Sinal Atual (Será ocultado se "Ativos" estiver selecionado) -->
            <div id="card-sinal" class="mt-4 bg-gray-700/50 rounded-xl p-6 text-center border border-gray-600 transition-all duration-300">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Sinal Atual</span>
                <div id="resultado-atual" class="text-3xl font-black text-gray-400 animate-pulse">CARREGANDO...</div>
            </div>

        </div>

        <!-- BOTÃO DE ATUALIZAÇÃO (Será ocultado se "Ativos" estiver selecionado) -->
        <div id="container-btn-atualizar" class="px-1 mt-3 flex justify-center">
           <button id="btn-atualizar" class="w-full max-w-xs flex items-center justify-center bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-lg font-semibold text-gray-300 py-1 px-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                <span>Atualizar</span>
            </button>
        </div>

        <!-- LISTA DE RESULTADOS ANTERIORES / HISTÓRICO (Será ocultada se "Ativos" estiver selecionado) -->
        <div id="container-historico" class="space-y-3">
            <h2 class="text-lg font-semibold text-gray-300 px-1">Histórico de Sinais</h2>
            
            <div id="lista-historico" class="space-y-2">
                <!-- Exemplo 1 -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">12</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>/</span> Bolsa Subiu
                    </div>
                </div>

                <!-- Exemplo 2 -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">08</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>V</span> Reversão de Fundo
                    </div>
                </div>

                <!-- Exemplo 3 -->
                <div class="flex items-center justify-between bg-rose-950 bg-opacity-40 border border-rose-900 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-rose-400 font-bold">03</span></span>
                    <div class="flex items-center gap-2 bg-rose-500 text-rose-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>^</span> Bolsa Recuou
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script> 
        // 1. Pega o nome do script que foi passado na URL (ex: ?script=app_Varejo.js)
        const urlParams = new URLSearchParams(window.location.search);
        const scriptParaCarregar = urlParams.get('script');
    
        // Elementos da interface que serão manipulados
        const cardSinal = document.getElementById('card-sinal');
        const containerBtnAtualizar = document.getElementById('container-btn-atualizar');
        const containerHistorico = document.getElementById('container-historico');
        const containerAbasAtivos = document.getElementById('container-abas-ativos');

        // 2. Se tiver um script na URL, cria a tag e injeta ela no fim do HTML
        if (scriptParaCarregar) {
            const scriptTag = document.createElement('script');
            scriptTag.src = scriptParaCarregar;
            document.body.appendChild(scriptTag);
    
            // Deixa o botão de rádio correto marcado como ativo baseado no valor da URL
            const radioAtivo = document.querySelector(`input[name="estrategia"][value="${scriptParaCarregar}"]`);
            if (radioAtivo) {
                radioAtivo.checked = true;
            }

            // SE O SCRIPT FOR O DE ATIVOS: Esconde o padrão e mostra as novas abas imediatamente
            if (scriptParaCarregar === 'app_teste.js') {
                cardSinal.classList.add('hidden');
                containerBtnAtualizar.classList.add('hidden');
                containerHistorico.classList.add('hidden');
                containerAbasAtivos.classList.remove('hidden');
            }
        }
    
        // 3. Escuta os botões de seleção dentro do container. Quando mudar, recarrega a página mudando a URL
        const containerEstrategia = document.getElementById('seletorEstrategia');
        containerEstrategia.addEventListener('change', function(event) {
            if (event.target && event.target.name === 'estrategia') {
                const arquivo = event.target.value;
                if (arquivo) {
                    window.location.search = `?script=${arquivo}`;
                }
            }
        });

        // 4. Lógica para alternar o visual ativo entre os botões das 3 abas (CSAN3, CEAB3, VAMO3)
        const botoesAbas = document.querySelectorAll('.aba-ativo');
        botoesAbas.forEach(botao => {
            botao.addEventListener('click', function() {
                // Remove o estilo ativo de todos os botões das abas
                botoesAbas.forEach(b => {
                    b.classList.remove('bg-emerald-500', 'text-emerald-950', 'shadow-md');
                    b.classList.add('text-gray-400', 'hover:text-gray-200', 'hover:bg-gray-800/50');
                });
                // Aplica o estilo ativo (verde destacado) no botão clicado
                this.classList.remove('text-gray-400', 'hover:text-gray-200', 'hover:bg-gray-800/50');
                this.classList.add('bg-emerald-500', 'text-emerald-950', 'shadow-md');

                const ativoSelecionado = this.getAttribute('data-ativo');
                console.log("Aba ativa selecionada:", ativoSelecionado);
                // Aqui depois inserimos a lógica de simulação para cada um deles
            });
        });
    </script>

</body>

</html>
