<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Indicador Quant</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

   
    
    <div class="max-w-xl mx-auto space-y-6">
        <!-- CARD PRINCIPAL: RESULTADO ATUAL (MANTIDO E REDUZIDO EM 20%) -->
        <div class="bg-gray-850 bg-opacity-50 border border-gray-800 rounded-2xl p-4 text-center shadow-xl backdrop-blur-sm">
            <!-- Rótulo Principal -->

             <h2>Selecione o Ativo/Estratégia:</h2>
                
                <!-- Botão de Seleção -->
                <select id="seletorEstrategia">
                    <option value="">-- Selecione o Ativo --</option>
                    <option value="app.js">PETR3 (Petróleo)</option>
                    <option value="app_teste.js">CEAB3 (C&A Varejo)</option>
                </select>
            
            <div class="text-white font-extrabold text-sm">
                Resultado atual:
            </div>
            
           <!-- Mude no seu index.html para forçar o tamanho e a cor -->
            <div id="resultado-atual" 
                 style="font-size: 2.25rem !important; color: #34d399 !important;" 
                 class="font-extrabold tracking-tight mt-1">
                 Aguardando...
            </div>

        </div>
        
        <!-- BOTÃO DE ATUALIZAÇÃO MAIS ESTREITO E JUSTIFICADO -->
        <div class="px-1 mt-3 flex justify-center">
            <!-- py-2 deixa o botão mais estreito verticalmente, e max-w-xs limita a largura horizontal -->
            <button id="btn-atualizar" class="w-full max-w-xs flex items-center justify-center bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-gray-900 font-bold py-2 px-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-emerald-400 text-sm">
                <span>Atualizar</span>
            </button>
        </div>


        <!-- LISTA DE RESULTADOS ANTERIORES -->
        <div class="space-y-3">
            <h2 class="text-lg font-semibold text-gray-300 px-1">Histórico de Sinais</h2>
            
            <div id="lista-historico" class="space-y-2">
                <!-- Os itens abaixo servem como exemplo visual e serão gerados dinamicamente pelo JavaScript depois -->
                
                <!-- Exemplo 1: Martelo (Subiu - Fundo Verde) -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">12</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>/</span> Bolsa Subiu
                    </div>
                </div>

                <!-- Exemplo 2: Engolfo de Alta (V desceu e subiu - Fundo Verde) -->
                <div class="flex items-center justify-between bg-emerald-950 bg-opacity-40 border border-emerald-800 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-emerald-400 font-bold">08</span></span>
                    <div class="flex items-center gap-2 bg-emerald-500 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>V</span> Reversão de Fundo
                    </div>
                </div>

                <!-- Exemplo 3: Reversão de Baixa / Alerta Falso (^ subiu e desceu - Fundo Vermelho) -->
                <div class="flex items-center justify-between bg-rose-950 bg-opacity-40 border border-rose-900 rounded-xl p-4 shadow-sm">
                    <span class="font-medium text-gray-200">Acertos: <span class="text-rose-400 font-bold">03</span></span>
                    <div class="flex items-center gap-2 bg-rose-500 text-rose-950 font-bold px-3 py-1 rounded-full text-sm">
                        <span>^</span> Bolsa Recuou
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script> 

        // 1. Pega o nome do script que foi passado na URL (ex: ?script=petr3.js)
        const urlParams = new URLSearchParams(window.location.search);
        const scriptParaCarregar = urlParams.get('script');

        // 2. Se tiver um script na URL, cria a tag e injeta ela no fim do HTML
        if (scriptParaCarregar) {
            const scriptTag = document.createElement('script');
            scriptTag.src = scriptParaCarregar;
            document.body.appendChild(scriptTag);

            // Deixa o select marcado com o ativo atual para você saber qual está rodando
            document.getElementById('seletorEstrategia').value = scriptParaCarregar;
        }

        // 3. Escuta o botão de seleção. Quando você mudar o ativo, ele recarrega a página mudando a URL
        document.getElementById('seletorEstrategia').addEventListener('change', function() {
            const arquivo = this.value;
            if (arquivo) {
                // Recarrega a página atual injetando o "?script=nome_do_arquivo.js"
                window.location.search = `?script=${arquivo}`;
            }
        });
    
    </script>
</body>
</html>
